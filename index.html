<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="PSE — baue Materie von Elementarteilchen bis Molekülen." />
    <title>PSE — Periodensystem der Elemente</title>
    <link rel="stylesheet" href="/src/ui/styles/main.css" />
  </head>
  <body>
    <canvas id="pse-canvas" aria-label="3D-Reaktionszone"></canvas>

    <header id="pse-toolbar">
      <span class="pse-brand">PSE</span>
      <div id="pse-reactors" class="pse-reactors" aria-label="Aktiver Reaktor"></div>
      <span class="pse-spacer"></span>
      <button
        id="pse-toggle-audio"
        class="pse-btn"
        type="button"
        title="Sound-Effekte an/aus"
      >
        🔊 Sound
      </button>
      <button
        id="pse-toggle-expert"
        class="pse-btn"
        type="button"
        title="Experten-Modus: Kern-Zwischenschritte und Sternfusion sichtbar"
      >
        Experten-Modus
      </button>
      <button id="pse-toggle-table" class="pse-btn" type="button" title="Periodensystem-Übersicht">
        Periodensystem
      </button>
      <button
        id="pse-toggle-kb"
        class="pse-btn"
        type="button"
        title="Wissensdatenbank — alles durchsuchbar"
      >
        📚 Wissen
      </button>
      <button
        id="pse-toggle-editor"
        class="pse-btn"
        type="button"
        title="Eigene Verbindungen anlegen"
      >
        ➕ Neu
      </button>
      <button
        id="pse-toggle-achievements"
        class="pse-btn"
        type="button"
        title="Ziele & Fortschritt"
      >
        🏆 Ziele
      </button>
      <button
        id="pse-toggle-mechanisms"
        class="pse-btn"
        type="button"
        title="Klassische Reaktions-Mechanismen mit Elektronenfluss"
      >
        ⚛ Mechanismen
      </button>
      <button
        id="pse-toggle-challenges"
        class="pse-btn"
        type="button"
        title="Aufgaben-Modus: konkrete Challenges mit Hinweisen"
      >
        🎯 Aufgaben
      </button>
      <button
        id="pse-toggle-sandbox"
        class="pse-btn"
        type="button"
        title="Sandbox: alle Elemente entdeckt, alle Reaktoren offen — eigener Save-Slot"
      >
        🎨 Sandbox
      </button>
      <button
        id="pse-reset"
        class="pse-btn pse-btn-rm"
        type="button"
        title="Kompletten Fortschritt löschen und neu starten"
      >
        Neustart
      </button>
      <span class="pse-version" id="pse-version">v0.0.0</span>
    </header>

    <section id="pse-table" class="pse-table-overlay" aria-label="Periodensystem" hidden></section>
    <section id="pse-kb" class="pse-kb-overlay" aria-label="Wissensdatenbank" hidden></section>
    <section id="pse-editor" class="pse-editor-overlay" aria-label="Custom-Verbindungs-Editor" hidden></section>
    <section id="pse-achievements" class="pse-achievements-overlay" aria-label="Ziele und Statistik" hidden></section>
    <section id="pse-mechanisms" class="pse-mechanisms-overlay" aria-label="Reaktions-Mechanismen" hidden></section>
    <section id="pse-challenges" class="pse-challenges-overlay" aria-label="Aufgaben-Modus" hidden></section>

    <aside id="pse-inventory" aria-label="Inventar">
      <h2>Inventar</h2>
      <p class="pse-hint">Noch leer — Meilenstein M1 bringt die ersten Teilchen.</p>
    </aside>

    <aside id="pse-detail" aria-label="Detail">
      <h2>Detail</h2>
      <p class="pse-hint">Wähle ein Element für Konfiguration, Masse und Quellen.</p>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
